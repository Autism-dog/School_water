version: "3.9"

services:
  water-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: school-water-web
    restart: unless-stopped
    ports:
      - "8080:8080"       # FastAPI (proxied by nginx below)
    volumes:
      - ssl_data:/root/Water/ssl
      - acme_data:/root/.acme.sh
    environment:
      - DOMAIN=${DOMAIN:-example.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: school-water-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_data:/etc/ssl/water:ro
    depends_on:
      - water-web

volumes:
  ssl_data:
  acme_data:
