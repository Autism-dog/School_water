# nginx reverse-proxy with HTTPS and seamless certificate hot-reload
# Place this file at web/nginx.conf

server {
    listen 80;
    server_name _;

    # ACME http-01 challenge (used by acme.sh --standalone)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2  on;
    server_name _;

    # ── SSL certificates managed by acme.sh ──
    # Hot-reload: nginx re-reads the files on each request via ssl_certificate_by_lua,
    # but a simple approach is: after acme.sh installs a new cert, run
    #   docker exec school-water-nginx nginx -s reload
    # The ssl_renew.sh script does this automatically.
    ssl_certificate     /etc/ssl/water/fullchain.pem;
    ssl_certificate_key /etc/ssl/water/privkey.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Permissions-Policy — grant Bluetooth to same-origin pages
    add_header Permissions-Policy "bluetooth=self";

    location / {
        proxy_pass         http://water-web:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # WebSocket support (for future live telemetry)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
