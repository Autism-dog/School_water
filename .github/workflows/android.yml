name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:     ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            python3-pip

      - name: Install buildozer + dependencies
        run: pip install buildozer cython

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Android SDK command-line tools
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          # Download the latest command-line tools
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extracted
          # Install under cmdline-tools/latest (required layout for sdkmanager self-update)
          mv /tmp/cmdline-tools-extracted/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          # Create legacy tools/ symlink so buildozer finds sdkmanager at tools/bin/sdkmanager
          # Use a relative target so the symlink works regardless of absolute path changes
          ln -sfn cmdline-tools/latest "$SDK_DIR/tools"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          # Also write license hashes directly for offline / cached runs.
          # First hash: standard SDK license; second hash: newer SDK versions.
          mkdir -p "$SDK_DIR/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$SDK_DIR/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$SDK_DIR/licenses/android-sdk-preview-license"
          # Accept all licenses via stdin
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true

      - name: Install required Android SDK packages
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          # Pre-install required API/build-tools so buildozer doesn't fail on missing API 34.
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build APK
        working-directory: android
        run: |
          # Copy core module into android build directory for import
          cp -r ../core ./core
          buildozer android debug 2>&1 | tee buildozer.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolWater-Android
          path: android/bin/*.apk
          if-no-files-found: error
